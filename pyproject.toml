[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "drake"
version = "0.1.0"
description = "Dynamic Runtime Adaptive Kernel Engine — shape-specialized fusion + LLVM-JIT dispatch for LLM decode inference"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.24",
    "llvmlite>=0.42",
]

[project.optional-dependencies]
# Linters are pinned to exact versions so CI and local runs enforce an
# identical ruleset -- a floating ">=" lets a newer ruff/mypy enable rules
# that pass locally but fail in CI (or vice versa).
dev = ["pytest>=7.0", "ruff==0.16.1", "mypy==2.3.0"]

[tool.setuptools]
py-modules = ["ir", "profiler", "runtime"]

[tool.setuptools.packages.find]
include = ["passes*", "codegen*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
# Explicit, curated ruleset so behaviour is deterministic across ruff
# versions rather than tracking ruff's evolving defaults:
#   E/W pycodestyle · F pyflakes · I import sorting · UP pyupgrade · B bugbear
select = ["E", "W", "F", "I", "UP", "B"]
